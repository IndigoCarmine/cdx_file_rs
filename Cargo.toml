[package]
name = "cdx-file-rs"
version = "0.1.0"
edition = "2024"
authors = ["taman"]
description = "A Rust library for reading and writing ChemDraw CDX files"

[dependencies]
binrw = "0.15.0"
thiserror = "2.0.18"
indexmap = { version = "2.2", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
byteorder = "1.5"
eframe = { version = "0.29", optional = true }
rfd = { version = "0.17.2", optional = true }
resvg = { version = "0.43.0", optional = true }
tiny-skia = { version = "0.11.0", optional = true }
usvg = { version = "0.43.0", optional = true }
toml = { version = "0.9.11", optional = true }
paste = "1.0"
dendron = "0.1.5"
image = { version = "0.25", optional = true }
imageproc = { version = "0.25", optional = true }
ab_glyph = { version = "0.2", optional = true }

quick-xml = "0.38"

[features]
default = ["render", "app"]
# SVG/PNG/egui rendering of a CDX document.
render = ["dep:eframe", "dep:resvg", "dep:tiny-skia", "dep:usvg", "dep:image", "dep:imageproc", "dep:ab_glyph"]
# The viewer/editor binary.
app = ["render", "dep:rfd", "dep:toml"]

[lib]
name = "cdx_file_rs"
path = "src/lib.rs"


[[bin]]
name = "cdx-file-rs"
path = "src/main.rs"
required-features = ["app"]

[[test]]
name = "export_test"
required-features = ["render"]

[[test]]
name = "sample_conversion_test"
required-features = ["render"]

[[example]]
name = "export_cdx"
required-features = ["render"]
